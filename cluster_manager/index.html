<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集群管理</title>
    <link rel="stylesheet" href="/plugins/cluster_manager/css/style.css">
</head>
<body>
<div class="cluster-manager-wrapper">
    <!-- 顶部工具栏 -->
    <div class="cluster-toolbar">
        <div class="toolbar-left">
            <h3><i class="fa fa-server"></i> 集群管理</h3>
            <button class="btn btn-success btn-sm" onclick="clusterApp.addGroup()">
                <i class="fa fa-plus"></i> 添加分组
            </button>
            <button class="btn btn-primary btn-sm" onclick="clusterApp.addNode()">
                <i class="fa fa-plus"></i> 添加节点
            </button>
            <button class="btn btn-info btn-sm" onclick="clusterApp.refreshAll()">
                <i class="fa fa-refresh"></i> 刷新状态
            </button>
        </div>
        <div class="toolbar-right">
            <button class="btn btn-default btn-sm" onclick="clusterApp.openMainDbConfig()">
                <i class="fa fa-database"></i> 主服务配置
            </button>
        </div>
    </div>

    <!-- 主体内容 -->
    <div class="cluster-body">
        <!-- 左侧分组列表 -->
        <div class="cluster-sidebar" id="clusterSidebar">
            <div class="sidebar-header">
                <span><i class="fa fa-th-list"></i> 面板分组</span>
            </div>
            <div class="sidebar-content" id="groupList">
                <!-- 动态渲染 -->
            </div>
        </div>

        <!-- 右侧节点列表 -->
        <div class="cluster-content" id="clusterContent">
            <div class="content-placeholder">
                <i class="fa fa-server" style="font-size:48px;color:#ccc;"></i>
                <p>请选择分组或添加节点</p>
            </div>
        </div>
    </div>
</div>

<!-- 模态框：添加/编辑分组 -->
<div class="modal fade" id="groupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="groupModalTitle">添加分组</h4>
            </div>
            <div class="modal-body">
                <input type="hidden" id="groupEditId">
                <div class="form-group">
                    <label>分组名称</label>
                    <input type="text" class="form-control" id="groupName" placeholder="请输入分组名称">
                </div>
                <div class="form-group">
                    <label>图标</label>
                    <input type="text" class="form-control" id="groupIcon" placeholder="fa fa-server" value="fa fa-server">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="clusterApp.saveGroup()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 模态框：添加/编辑节点 -->
<div class="modal fade" id="nodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title" id="nodeModalTitle">添加节点</h4>
            </div>
            <div class="modal-body">
                <input type="hidden" id="nodeEditId">
                <div class="form-group">
                    <label>所属分组</label>
                    <select class="form-control" id="nodeGroupId"></select>
                </div>
                <div class="form-group">
                    <label>节点名称</label>
                    <input type="text" class="form-control" id="nodeName" placeholder="如: Web-Server-01">
                </div>
                <div class="form-group">
                    <label>主机地址</label>
                    <input type="text" class="form-control" id="nodeHost" placeholder="IP或域名">
                </div>
                <div class="form-group">
                    <label>面板端口</label>
                    <input type="number" class="form-control" id="nodePort" value="7200">
                </div>
                <div class="form-group">
                    <label>认证用户</label>
                    <input type="text" class="form-control" id="nodeAuthUser" placeholder="可选">
                </div>
                <div class="form-group">
                    <label>认证Token</label>
                    <input type="password" class="form-control" id="nodeAuthToken" placeholder="可选">
                </div>
                <div class="form-group">
                    <label class="inline-label">
                        <input type="checkbox" id="nodeIsMaster"> 设为主节点
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="clusterApp.saveNode()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 模态框：主服务数据库配置 -->
<div class="modal fade" id="mainDbModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"><i class="fa fa-database"></i> 主服务数据库配置</h4>
            </div>
            <div class="modal-body">
                <div class="db-config-section">
                    <div class="form-group">
                        <label class="inline-label">
                            <input type="checkbox" id="useExternalDb" onchange="clusterApp.toggleExternalDb()"> 使用外部数据库
                        </label>
                        <span class="help-block">启用后集群数据将存储到指定的数据库中，支持跨节点数据同步</span>
                    </div>
                    <div id="externalDbConfig" style="display:none;">
                        <div class="form-group">
                            <label>数据库类型</label>
                            <select class="form-control" id="mainDbType" onchange="clusterApp.onDbTypeChange()">
                                <option value="">请选择数据库类型</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>主机地址</label>
                            <input type="text" class="form-control" id="mainDbHost" value="127.0.0.1">
                        </div>
                        <div class="form-group">
                            <label>端口</label>
                            <input type="number" class="form-control" id="mainDbPort" value="3306">
                        </div>
                        <div class="form-group">
                            <label>数据库名</label>
                            <input type="text" class="form-control" id="mainDbName" value="mdserver_cluster">
                        </div>
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" class="form-control" id="mainDbUser">
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" class="form-control" id="mainDbPassword">
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-warning btn-sm" onclick="clusterApp.testDbConnection()">
                                <i class="fa fa-plug"></i> 测试连接
                            </button>
                            <button class="btn btn-info btn-sm" onclick="clusterApp.initExternalDb()">
                                <i class="fa fa-database"></i> 初始化数据库
                            </button>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="sync-config-section">
                    <h4>同步设置</h4>
                    <div class="form-group">
                        <label>心跳检测间隔(秒)</label>
                        <input type="number" class="form-control" id="syncInterval" value="60" min="10">
                    </div>
                    <div class="form-group">
                        <label>心跳超时(秒)</label>
                        <input type="number" class="form-control" id="heartbeatTimeout" value="30" min="5">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="clusterApp.saveMainDbConfig()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 模态框：子面板设置 -->
<div class="modal fade" id="subPanelModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title"><i class="fa fa-cog"></i> 子面板设置</h4>
            </div>
            <div class="modal-body">
                <input type="hidden" id="subPanelServiceId">
                <div class="sub-panel-config">
                    <div class="form-group">
                        <label>服务配置</label>
                        <textarea class="form-control" id="subPanelConfig" rows="12" 
                            placeholder='{"port":8080,"workers":4,"max_conn":1024}'></textarea>
                        <span class="help-block">JSON格式的服务配置</span>
                    </div>
                    <div class="form-group">
                        <label>环境变量</label>
                        <textarea class="form-control" id="subPanelEnv" rows="4"
                            placeholder='{"NODE_ENV":"production","LOG_LEVEL":"info"}'></textarea>
                    </div>
                    <div class="form-group">
                        <label>启动参数</label>
                        <input type="text" class="form-control" id="subPanelArgs" 
                            placeholder="--config /etc/myapp/config.yml">
                    </div>
                    <div class="form-group">
                        <label>工作目录</label>
                        <input type="text" class="form-control" id="subPanelWorkDir" 
                            placeholder="/opt/myapp">
                    </div>
                    <div class="form-group">
                        <label>日志路径</label>
                        <input type="text" class="form-control" id="subPanelLogPath" 
                            placeholder="/var/log/myapp/app.log">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-info" onclick="clusterApp.syncSubPanelConfig()">
                    <i class="fa fa-cloud-upload"></i> 同步到远程
                </button>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="clusterApp.saveSubPanelConfig()">保存</button>
            </div>
        </div>
    </div>
</div>

<script src="/plugins/cluster_manager/js/drag.js"></script>
<script src="/plugins/cluster_manager/js/cluster.js"></script>
<script>
$(function(){
    clusterApp.init();
});
</script>
</body>
</html>
